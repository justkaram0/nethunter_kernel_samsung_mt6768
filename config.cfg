# =========================
# Kernel Builder Config
# =========================
# By Karamdev1
# =========================

# For toolchains you can set the folders however you want but make sure to add them to paths
# for single folder just "$FOLDERNAME", but for multiple lets say folder1 and folder2 "$folder1:$folder2", ':' is the separator!

# To identify optional values check for 'optional' comment after it
# For optional values set value "" if you dont want to set anything

# --- Architecture --- Required
ARCH=arm64

# --- Toolchain --- Toolchain Folders here
TD="$HOME/toolchains/zyc-clang-14-20260619/bin"

# --- Paths ---
# PATHS is the paths to export during setup
PATHS="$TD"
CC=clang
CLANG_TRIPLE=aarch64-linux-gnu-
CROSS_COMPILE_TOGGLE=y # y for enabled, n for disabled
CROSS_COMPILE=aarch64-linux-gnu- # Required if CROSS_COMPILE_TOGGLE is enabled

# Only for arm64 kernels that require arm32 toolchain
CROSS_COMPILE_ARM32=arm-linux-gnueabi- # Required if CROSS_COMPILE_TOGGLE is enabled

# --- Build Flags ---
KCFLAGS=" -w -pipe -O3" # Optional
KCPPFLAGS=" -O3" # Optional
ANDROID_MAJOR_VERSION=r # Optional
SECTION_MISMATCH=y # y for warn only, e for normal mismatch, n for disabled
ENV="" # Optional

# --- Build output ---
OUT_DIR=out
MODULES_OUT_DIR=out_modules
